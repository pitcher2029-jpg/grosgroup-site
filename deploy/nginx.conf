# GROSGROUP — nginx для VPS. Подключение: /etc/nginx/sites-available/grosgroup → ln -s в sites-enabled, nginx -t, systemctl reload nginx.
# Перед установкой: заменить grosgroup.ru на домен (tools/set-domain.mjs делает это сам), выпустить сертификат
# (порядок с сертификатом — LAUNCH.md, раздел 4).
# Сайт лежит в /var/www/grosgroup: index.html, 404.html, privacy.html, consent.html, robots.txt, sitemap.xml, assets/.
# Обработчик заявок — служба grosgroup-lead (deploy/grosgroup-lead.service) на 127.0.0.1:8787.

limit_req_zone $binary_remote_addr zone=grosgroup_lead:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name grosgroup.ru www.grosgroup.ru;
    location /.well-known/acme-challenge/ { root /var/www/grosgroup; }
    location / { return 301 https://grosgroup.ru$request_uri; }
}

server {
    # http2 в listen работает во всех версиях nginx (директива «http2 on» — только с 1.25.1)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.grosgroup.ru;
    ssl_certificate     /etc/letsencrypt/live/grosgroup.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grosgroup.ru/privkey.pem;
    return 301 https://grosgroup.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grosgroup.ru;

    ssl_certificate     /etc/letsencrypt/live/grosgroup.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grosgroup.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/grosgroup;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # CSP: хэш — встроенный скрипт в <head> index.html; при его правке хэш пересчитывает tools/prelaunch-check.mjs.
    # Яндекс Метрика: mc.yandex.ru, yastatic.net. style 'unsafe-inline' — атрибуты style="--d:…" задержек появления.
    set $csp "default-src 'self'; script-src 'self' 'sha256-faCN5M9dKGUp3TQbuqgmNzfvtiXPbHanrYRpjrX4Qzw=' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; child-src blob: https://mc.yandex.ru; frame-src blob: https://mc.yandex.ru; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    error_page 404 /404.html;

    # Служебные файлы репозитория и прототип ROY наружу не отдаются
    location ~ ^/(server|deploy|tools|roy|\.git)(/|$) { return 404; }
    location ~ \.(md|mjs|env|example|service|conf)$ { return 404; }

    # Обработчик заявок
    location = /api/lead {
        limit_req zone=grosgroup_lead burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 52m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML всегда свежий; CSS, JS, картинки и шрифты — неделя (имена файлов без хэша версии)
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.woff2$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
